[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localemesh"
version = "1.0.0"
description = "Offline contract-aware checker for multilingual Web releases"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
browser = ["websocket-client>=1.8,<2"]

[project.scripts]
localemesh = "localemesh.cli:main"

[tool.setuptools.packages.find]
include = ["localemesh*"]

[tool.coverage.run]
branch = true
source = ["localemesh"]

[tool.coverage.report]
show_missing = true
skip_covered = false
